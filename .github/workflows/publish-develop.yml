name: Publish (develop)

# Runs on every merge to develop. Publishes to the real Visual Studio
# Marketplace with the run number appended as the manifest's 4th version
# quad - see _publish-vsix.yml for why there's no true "pre-release" channel
# for VS extensions.

on:
  push:
    # TODO(jc): remove "feature/jc/publish-vsix-workflows" before merging - it's
    # here only so this workflow can be end-to-end tested (real Marketplace
    # publish) from the feature branch itself, since workflow_dispatch won't
    # show up in the Actions UI until this file lands on the default branch.
    branches: [develop, feature/jc/publish-vsix-workflows]
  workflow_dispatch: {}

jobs:
  publish:
    uses: ./.github/workflows/_publish-vsix.yml
    with:
      bump_run_number: true
    secrets:
      VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
